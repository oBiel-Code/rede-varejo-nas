frr defaults traditional
hostname nuvem
log stdout
ip forwarding
!
interface eth1
 description MPLS
 ip address 100.64.1.13/30
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description Internet
 ip address 100.64.2.13/30
 ip ospf area 0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth3
 description privada
 ip address 10.20.8.1/24
 ip ospf area 0
 ip ospf passive
!
!
! Saida local para o site externo simulado
ip route 100.64.200.0/24 100.64.2.14
!
router ospf
 ospf router-id 10.255.0.21
!
