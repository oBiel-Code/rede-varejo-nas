frr defaults traditional
hostname loja1
log stdout
ip forwarding
!
interface eth1
 description MPLS
 ip address 100.64.1.5/30
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description Internet
 ip address 100.64.2.5/30
 ip ospf area 0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth3
 description caixas
 ip address 10.20.5.129/26
 ip ospf area 0
 ip ospf passive
!
interface eth4
 description convidados
 ip address 10.20.4.1/24
 ip ospf area 0
 ip ospf passive
!
interface eth5
 description iot
 ip address 10.20.5.193/26
 ip ospf area 0
 ip ospf passive
!
!
! Saida local para o site externo simulado
ip route 100.64.200.0/24 100.64.2.6
!
router ospf
 ospf router-id 10.255.0.11
!
